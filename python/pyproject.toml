[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ivcrtest"
version = "0.1.0.dev0"
description = "Correlation-restriction test for instrument validity (Python port of the R package ivcrtest)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "COPYRIGHTS"]
authors = [
  { name = "Ratbek Dzhumashev" },
  { name = "Ainura Tursunalieva" },
]
keywords = ["instrumental variables", "instrument validity", "partial identification", "econometrics"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Ainura-tur/ivcrtest"
Issues = "https://github.com/Ainura-tur/ivcrtest/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ivcrtest"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "README.md", "LICENSE", "COPYRIGHTS"]

[tool.pytest.ini_options]
testpaths = ["tests"]
